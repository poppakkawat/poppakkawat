<title>บัตรคำฮั่นเวียด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: single centered study column — header, one flip card, controls, word list */
:root{
  --bg:#e9eeeb; --surface:#f8faf8; --ink:#17231f; --muted:#5b6b65; --line:#cdd8d3;
  --seal:#b3261e; --seal-ink:#fff6f3; --jade:#1f6b57; --jade-soft:#d6e8e1;
  --f-vi:"Be Vietnam Pro",system-ui,sans-serif;
  --f-han:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-th:"Noto Sans Thai","Sukhumvit Set","Leelawadee UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101715; --surface:#18221f; --ink:#e6eeea; --muted:#94a69f; --line:#2a3833;
  --seal:#d9483d; --seal-ink:#fff6f3; --jade:#6cc3a7; --jade-soft:#1d3a31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#18221f; --ink:#e6eeea; --muted:#94a69f; --line:#2a3833;
  --seal:#d9483d; --seal-ink:#fff6f3; --jade:#6cc3a7; --jade-soft:#1d3a31; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-th);font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.35rem;font-weight:600;text-wrap:balance}
h1 small{display:block;font-family:var(--f-vi);font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--jade)}
.count{font-family:var(--f-vi);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}

.decks{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--surface)}
.deck{font:inherit;font-size:.95rem;border:0;border-radius:8px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.deck[aria-selected="true"]{background:var(--jade);color:var(--surface);font-weight:600}
.deck:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.deck .n{font-family:var(--f-vi);font-variant-numeric:tabular-nums;opacity:.75;margin-left:4px}
.origin{display:inline-block;align-self:flex-start;font-size:.8rem;padding:1px 10px;border-radius:999px;background:var(--jade-soft);color:var(--ink);margin-bottom:8px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--ink)}

.stage{perspective:1400px}
.card{position:relative;display:grid;width:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card.instant{transition:none}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:340px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
.back{transform:rotateY(180deg)}
.card:focus-visible{outline:none}
.card:focus-visible .face{outline:3px solid var(--jade);outline-offset:3px}
.say{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--jade);cursor:pointer;padding:0;vertical-align:middle}
.say:hover{border-color:var(--jade)}
.say:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.say.sm{width:30px;height:30px}
.say.sm svg{width:15px;height:15px}
.say.playing{background:var(--jade);color:var(--surface);border-color:var(--jade)}
.front .say{position:absolute;top:16px;right:16px}
.front{position:relative}
.head{display:flex;align-items:center;gap:10px}
.voice-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.voice-row select{font:inherit;font-size:.85rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%;min-width:0}
.tts-msg{margin:0;font-size:.85rem;color:var(--seal)}
.hint{margin-top:auto;font-size:.8rem;color:var(--muted)}

.front .main{flex:1;display:grid;place-items:center;text-align:center;gap:8px}
.big-vi{font-family:var(--f-vi);font-weight:700;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.15}
.big-han{font-family:var(--f-han);font-weight:700;font-size:clamp(2.6rem,11vw,4rem);letter-spacing:.08em}
.big-th{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:600}

.back h2{margin:0;font-family:var(--f-vi);font-size:1.6rem;font-weight:700}
.back .mean{font-size:1.25rem;font-weight:600;color:var(--jade);margin:2px 0 16px}
.parts{display:grid;gap:10px}
.part{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.seal{width:58px;height:58px;display:grid;place-items:center;background:var(--seal);color:var(--seal-ink);font-family:var(--f-han);font-weight:700;font-size:2rem;border-radius:6px;box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 4px rgba(255,255,255,.55)}
.seal.none{background:transparent;color:var(--muted);box-shadow:none;border:2px dashed var(--line);font-size:1.4rem}
.part-txt{min-width:0}
.part-vi{font-family:var(--f-vi);font-weight:700;font-size:1.1rem}
.py{font-family:var(--f-vi);font-style:italic;color:var(--muted);font-weight:400;margin-left:6px}
.part-th{color:var(--ink)}
.note{margin-top:12px;font-size:.9rem;color:var(--muted)}
.src{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.src b{color:var(--jade);font-weight:600}
.note b{font-family:var(--f-han);color:var(--ink);font-weight:500}

.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{font:inherit;font-size:.95rem;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--jade)}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.known[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.row2{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.link{font:inherit;background:none;border:0;color:var(--jade);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--muted);margin-bottom:12px}
.search:focus-within{border-color:var(--jade);outline:2px solid var(--jade-soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-family:var(--f-vi),var(--f-th);outline:none}
.list .dk{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;white-space:nowrap}
.list .empty{color:var(--muted);font-size:.9rem;padding:8px 2px}
.list h3{margin:0 0 6px;font-size:.8rem;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.list ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.list li button{width:100%;display:flex;justify-content:space-between;gap:10px;font:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;color:var(--ink);cursor:pointer;text-align:left}
.list li button[aria-current="true"]{color:var(--jade);font-weight:600}
.list .lv{font-family:var(--f-vi)}
.list .lh{font-family:var(--f-han);color:var(--muted)}
.tick{color:var(--jade)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1><small>Từ Hán Việt</small>บัตรคำฮั่นเวียด</h1>
    <span class="count" id="count">1 / 1</span>
  </header>

  <div class="decks" role="tablist" aria-label="ชุดคำ">
    <button class="deck" id="d-han" role="tab" data-deck="han">ฮั่นเวียด<span class="n" id="n-han"></span></button>
    <button class="deck" id="d-other" role="tab" data-deck="other">คำอื่น ๆ<span class="n" id="n-other"></span></button>
  </div>

  <div class="modes" role="group" aria-label="ด้านหน้าการ์ดแสดง">
    <button class="chip" id="m-vi" data-mode="vi" aria-pressed="true">หน้า: เวียดนาม</button>
    <button class="chip" id="m-han" data-mode="han" aria-pressed="false">หน้า: อักษรจีน</button>
    <button class="chip" id="m-th" data-mode="th" aria-pressed="false">หน้า: ไทย</button>
  </div>

  <div class="stage">
    <div class="card" id="card" role="button" tabindex="0" aria-label="พลิกการ์ด">
      <div class="face front" id="front"></div>
      <div class="face back" id="back" aria-hidden="true"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prev">← ก่อนหน้า</button>
    <button class="btn known" id="known" aria-pressed="false">จำได้แล้ว</button>
    <button class="btn" id="next">ถัดไป →</button>
  </div>
  <div class="voice-row" id="voice-row">
    <label for="voice-sel">เสียงอ่าน</label>
    <select id="voice-sel"></select>
    <button class="link" id="voice-test" type="button">ทดลองฟัง</button>
    <span id="voice-info"></span>
  </div>
  <p class="tts-msg" id="tts-msg" hidden></p>
  <div class="row2">
    <span>แตะการ์ดหรือกด Space เพื่อพลิก · ← → เปลี่ยนคำ</span>
    <button class="link" id="shuffle">สุ่มลำดับ</button>
  </div>

  <section class="list">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="ค้นหา เช่น cấp, cap, 級, ระดับ" autocomplete="off" spellcheck="false">
    </label>
    <h3 id="list-title">คำทั้งหมด</h3>
    <ol id="list"></ol>
  </section>
</div>

<script>
const WORDS = [
  {
    vi: "Khách sạn", th: "โรงแรม",
    parts: [
      { vi: "Khách", han: "客", py: "kè", th: "แขก / ผู้เข้าพัก" },
      { vi: "Sạn", han: "棧", py: "zhàn", th: "ที่พัก / ร้านค้า" }
    ],
    note: "ในภาษาจีน <b>客棧</b> (kèzhàn) หมายถึงโรงเตี๊ยมหรือที่พักแรมสมัยก่อน"
  },
  {
    vi: "Làm việc", th: "ทำงาน",
    parts: [
      { vi: "Làm", th: "ทำ (คำเวียดแท้ ไม่มีอักษรจีน)" },
      { vi: "Việc", han: "役", py: "yì", th: "งาน / ภาระหน้าที่" }
    ],
    note: "คำลูกผสม: Làm เป็นคำเวียดแท้ ส่วน Việc เป็นเสียงฮั่นเวียดยุคเก่า (Hán Việt cổ) ของ <b>役</b> ซึ่งเสียงฮั่นเวียดมาตรฐานของตัวนี้คือ dịch"
  },
  {
    vi: "Dịch vụ", th: "บริการ",
    parts: [
      { vi: "Dịch", han: "役", py: "yì", th: "งาน / การรับใช้ / แรงงาน" },
      { vi: "Vụ", han: "務", py: "wù", th: "กิจการ / ธุระ / หน้าที่" }
    ],
    note: "役 ตัวเดียวกับ việc ใน làm việc แต่ที่นี่อ่านแบบฮั่นเวียดมาตรฐาน (dịch) · ภาษาจีนปัจจุบันใช้ <b>服務</b> (fúwù) แทน ส่วน <b>役務</b> ยังใช้ในภาษาญี่ปุ่น (ekimu)"
  },
  {
    vi: "Nhà vệ sinh", th: "ห้องน้ำ / ห้องสุขา",
    parts: [
      { vi: "Nhà", th: "บ้าน / ห้อง / อาคาร (คำเวียดแท้ ไม่มีอักษรจีน)" },
      { vi: "Vệ", han: "衛", py: "wèi", th: "ปกป้อง / พิทักษ์" },
      { vi: "Sinh", han: "生", py: "shēng", th: "ชีวิต / การมีชีวิต" }
    ],
    note: "คำลูกผสม: nhà (เวียดแท้) + vệ sinh <b>衛生</b> ที่แปลว่า สุขอนามัย (ปกป้องชีวิต) · ภาษาจีนก็เรียกห้องน้ำว่า <b>衛生間</b> (wèishēngjiān) แปลตรงตัวว่า ห้องสุขอนามัย"
  },
  {
    vi: "Nhà hàng", th: "ร้านอาหาร / ภัตตาคาร",
    parts: [
      { vi: "Nhà", th: "บ้าน / อาคาร (คำเวียดแท้ ไม่มีอักษรจีน)" },
      { vi: "Hàng", han: "行", py: "háng", th: "ร้านค้า / กิจการ / สินค้า" }
    ],
    note: "คำลูกผสม: ตรงตัวคือ อาคารร้านค้า · 行 ตัวเดียวกับใน ngân hàng <b>銀行</b> (ธนาคาร = ร้านเงิน) ระวังสับสนกับ hành <b>行</b> ที่แปลว่า เดิน/กระทำ ซึ่งเป็นตัวเดียวกันแต่อ่านต่างกันตามความหมาย"
  },
  {
    vi: "Ngân hàng", th: "ธนาคาร",
    parts: [
      { vi: "Ngân", han: "銀", py: "yín", th: "เงิน (โลหะเงิน)" },
      { vi: "Hàng", han: "行", py: "háng", th: "ร้านค้า / กิจการ" }
    ],
    note: "ตรงตัวคือ ร้านเงิน · ภาษาจีนใช้ <b>銀行</b> (yínháng) ภาษาญี่ปุ่น ginkō และภาษาเกาหลี eunhaeng ก็มาจากคำเดียวกัน · คู่กับ nhà hàng ที่ใช้ hàng ตัวเดียวกัน"
  },
  {
    vi: "Kẻ địch", th: "ศัตรู / ข้าศึก", src: "ROV (Liên Quân Mobile)",
    parts: [
      { vi: "Kẻ", th: "คน / ผู้ (คำเวียดแท้ ใช้กับคนในแง่ลบ)" },
      { vi: "Địch", han: "敵", py: "dí", th: "ศัตรู / ต่อต้าน" }
    ],
    note: "คำลูกผสม: kẻ ใช้นำหน้าคนที่ไม่ดี เช่น kẻ trộm (ขโมย) kẻ thù (ศัตรู) · 敵 เจอในคำฮั่นเวียดอื่น เช่น vô địch <b>無敵</b> (ไร้ศัตรู = แชมป์) และ đối địch <b>對敵</b> (เป็นปฏิปักษ์)"
  },
  {
    vi: "Đối thủ", th: "คู่แข่ง / คู่ต่อสู้", src: "ROV (Liên Quân Mobile)",
    parts: [
      { vi: "Đối", han: "對", py: "duì", th: "ตรงข้าม / เผชิญหน้า / คู่" },
      { vi: "Thủ", han: "手", py: "shǒu", th: "มือ → ผู้ทำ / ผู้เล่น" }
    ],
    note: "ตรงตัวคือ มือฝั่งตรงข้าม · ภาษาจีนใช้ <b>對手</b> (duìshǒu) เหมือนกัน · 手 ในความหมาย ผู้เล่น/ผู้ชำนาญ เจอใน cầu thủ <b>球手</b> (นักฟุตบอล) tuyển thủ <b>選手</b> (นักกีฬาตัวแทน) · ต่างจาก kẻ địch ตรงที่ đối thủ เป็นคู่แข่งธรรมดา ไม่จำเป็นต้องเป็นศัตรู"
  },
  {
    vi: "Gây sát thương", th: "สร้างความเสียหาย / ทำดาเมจ", src: "ROV (Liên Quân Mobile)",
    parts: [
      { vi: "Gây", th: "ก่อ / ทำให้เกิด (คำเวียดแท้ ไม่มีอักษรจีน)" },
      { vi: "Sát", han: "殺", py: "shā", th: "ฆ่า" },
      { vi: "Thương", han: "傷", py: "shāng", th: "บาดเจ็บ / บาดแผล" }
    ],
    note: "วลีลูกผสม: gây (เวียดแท้) + sát thương <b>殺傷</b> ที่แปลว่า ความเสียหาย / ดาเมจ · ในเกมเจอคู่กับ sát thương vật lý (ดาเมจกายภาพ) และ sát thương phép (ดาเมจเวท) · 傷 ตัวเดียวกับใน bị thương (ได้รับบาดเจ็บ)"
  },
  {
    vi: "Sát thương phép", th: "ดาเมจเวท / ความเสียหายเวทมนตร์", src: "ROV (Liên Quân Mobile)",
    parts: [
      { vi: "Sát", han: "殺", py: "shā", th: "ฆ่า" },
      { vi: "Thương", han: "傷", py: "shāng", th: "บาดเจ็บ" },
      { vi: "Phép", han: "法", py: "fǎ", th: "เวทมนตร์ / วิชา / กฎ" }
    ],
    note: "phép เป็นเสียงฮั่นเวียดยุคเก่า (Hán Việt cổ) ของ <b>法</b> ส่วนเสียงมาตรฐานคือ pháp เช่น pháp luật <b>法律</b> (กฎหมาย) · คล้าย việc/dịch ที่เป็นตัว 役 เดียวกัน · ในเกมเจอ phép thuật <b>法術</b> (เวทมนตร์) และ pháp sư <b>法師</b> (เมจ)"
  },
  {
    vi: "Sát thương vật lý", th: "ดาเมจกายภาพ", src: "ROV (Liên Quân Mobile)",
    parts: [
      { vi: "Sát", han: "殺", py: "shā", th: "ฆ่า" },
      { vi: "Thương", han: "傷", py: "shāng", th: "บาดเจ็บ" },
      { vi: "Vật", han: "物", py: "wù", th: "สิ่งของ / วัตถุ" },
      { vi: "Lý", han: "理", py: "lǐ", th: "หลักการ / เหตุผล" }
    ],
    note: "vật lý <b>物理</b> แปลว่า ฟิสิกส์ / ทางกายภาพ (ตรงตัวคือ หลักของวัตถุ) ภาษาจีนใช้ <b>物理傷害</b> สำหรับดาเมจกายภาพ · คู่กับ sát thương phép (ดาเมจเวท)"
  },
  {

    note: "คำซ้อนเสียง (từ láy) ที่ขึ้นต้นด้วยเสียง kh เหมือนกัน คล้าย ยุ่งยาก ในภาษาไทย · ใช้ได้ทั้งคุณศัพท์และคำนาม เช่น Bài này khó khăn quá. (ข้อนี้ยากจัง) gặp khó khăn (เจอปัญหา) · khó เดี่ยว ๆ ใช้บ่อยกว่า เช่น khó quá! (ยากมาก!) ตรงข้ามคือ dễ (ง่าย) · ระวัง: khăn เดี่ยว ๆ อีกคำแปลว่า ผ้า เช่น khăn tắm (ผ้าเช็ดตัว) · คำฮั่นเวียดที่ความหมายใกล้กันคือ gian nan <b>艱難</b> (ยากลำบาก)"
  },
  {
    deck: "other", origin: "คำเวียดแท้ (thuần Việt)",
    vi: "Rắc rối", th: "ยุ่งยาก / ซับซ้อน / ปัญหา",
    parts: [
      { vi: "Rắc", th: "(พยางค์เสริมเสียง ในคำนี้ไม่มีความหมายแยก)" },
      { vi: "Rối", th: "พันกัน / ยุ่งเหยิง" }
    ],
    note: "คำซ้อนเสียง (từ láy) ขึ้นต้นด้วย r เหมือนกัน แบบเดียวกับ khó khăn · ใช้ได้ทั้งคุณศัพท์และคำนาม: Chuyện này rắc rối quá. (เรื่องนี้ยุ่งยากจัง) gặp rắc rối (เจอปัญหา/ซวย) gây rắc rối (ก่อเรื่อง ดูบัตร Gây) · rối เดี่ยว ๆ = พันกัน เช่น tóc rối (ผมพันกัน) rối loạn (สับสนวุ่นวาย ซึ่ง loạn = <b>亂</b>) · คำฮั่นเวียดที่ใกล้กันคือ phức tạp <b>複雜</b> (ซับซ้อน)"
  },
  {
    deck: "other", origin: "คำเวียดแท้ (thuần Việt)",
    vi: "Những", th: "พวก / บรรดา (บอกพหูพจน์)",
    parts: [
      { vi: "Những", th: "วางหน้าคำนาม บอกว่ามีหลายอัน" }
    ],
    note: "ภาษาเวียดนามไม่ผันคำนามเป็นพหูพจน์ จึงใช้ những วางหน้าแทน เช่น những người bạn (บรรดาเพื่อน ๆ) những ngày mưa (วันฝนตกทั้งหลาย) · ต่างจาก các ที่หมายถึง ทั้งหมดทุกตัว เช่น các bạn (พวกเธอทุกคน) ส่วน những เน้นบางส่วน/บางกลุ่ม · ระวังสะกด: những (ư) ≠ nhũng (u) ซึ่งเป็นฮั่นเวียด <b>冗</b> ใน tham nhũng (คอร์รัปชัน)"
  },
  {
    deck: "other", origin: "คำเวียดแท้ (thuần Việt)",
    vi: "Bọn họ", th: "พวกเขา / พวกนั้น",
    parts: [
      { vi: "Bọn", th: "พวก / กลุ่ม (ใช้กับคน ภาษาพูด มักออกแนวไม่สุภาพ)" },
      { vi: "Họ", th: "เขา (พหูพจน์) / พวกเขา" }
    ],
    note: "họ คำเดียวก็แปลว่า พวกเขา และเป็นกลางกว่า · เติม bọn ข้างหน้าจะฟังเป็นกันเองหรือห่างเหิน บางครั้งดูแคลน (คล้าย พวกมัน/พวกนั้น) · bọn ใช้กับคำอื่นได้: bọn mình (พวกเรา แบบกันเอง) bọn trẻ (พวกเด็ก ๆ) · เทียบ những (ดูบัตร Những) ที่ใช้กับสิ่งของได้ แต่ bọn ใช้กับคนหรือสัตว์เท่านั้น · ระวัง: họ ยังแปลว่า นามสกุล ได้ เช่น họ Nguyễn (นามสกุลเหงียน)"
  },
  {
    deck: "other", origin: "คำเวียดแท้ (thuần Việt) · ที่มาของ từ ไม่แน่ชัด",
    vi: "Đến từ", th: "มาจาก",
    parts: [
      { vi: "Đến", th: "มา / ถึง" },
      { vi: "Từ", th: "จาก (บอกจุดเริ่มต้น)" }
    ],
    note: "ประโยคแนะนำตัว: Tôi đến từ Thái Lan. (ฉันมาจากประเทศไทย) · ถาม: Bạn đến từ đâu? (เธอมาจากไหน?) · từ เดี่ยว ๆ = จาก/ตั้งแต่ เช่น từ sáng đến tối (ตั้งแต่เช้าถึงค่ำ) · บางตำราโยง từ กับ <b>自</b> (ฮั่นเวียดมาตรฐาน tự) แต่ไม่แน่ชัด · ระวังสับสนกับ từ ฮั่นเวียด <b>詞</b> = คำ เช่น từ điển <b>詞典</b> (พจนานุกรม)"
  },
  {
    deck: "other", origin: "คำเวียดแท้ (thuần Việt)",
    vi: "Sao", th: "ทำไม / ยังไง · ดาว",
    parts: [
      { vi: "Sao", th: "① ทำไม / ยังไง (คำถาม) ② ดาว" }
    ],
    note: "① คำถาม: Sao vậy? (เป็นอะไรไป? / ทำไมล่ะ?) Sao không đi? (ทำไมไม่ไป?) · tại sao = ทำไม (แบบเต็ม ซึ่ง tại = <b>在</b>) · Không sao! (ไม่เป็นไร!) · ② ดาว: ngôi sao (ดวงดาว ดูบัตร Ngôi trường) และใช้ให้คะแนนดาว เช่น 5 sao (5 ดาว)"
  },
  {
    deck: "other", origin: "คำเวียดแท้ (thuần Việt)",
    vi: "Nổi tiếng", th: "มีชื่อเสียง / โด่งดัง",
    parts: [
      { vi: "Nổi", th: "ลอย / ผุดขึ้น / โดดเด่น" },
      { vi: "Tiếng", th: "เสียง → ชื่อเสียง (ยังแปลว่า ภาษา ได้ด้วย)" }
    ],
    note: "ตรงตัวคือ เสียงลอยขึ้นมา (เป็นที่ได้ยินทั่ว) · tiếng ตัวเดียวกับใน tiếng Việt (ภาษาเวียดนาม) tiếng Thái (ภาษาไทย) · คำที่ความหมายคล้ายกันแบบฮั่นเวียดคือ nổi danh ซึ่ง danh = <b>名</b> (ชื่อ) และ danh tiếng (ชื่อเสียง)"
  }
];

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let deck = store.get("hv-deck", "han");
const deckOf = w => w.deck || "han";
let order = [];
const loadDeck = () => { order = WORDS.map((w, i) => deckOf(w) === deck ? i : -1).filter(i => i >= 0); pos = 0; };
let pos = 0;
let curMode = store.get("hv-mode", "vi");
let known = new Set(store.get("hv-known", []));

const $ = id => document.getElementById(id);
const card = $("card");
const hanOf = w => w.parts.map(p => p.han || p.vi.toLowerCase()).join(" ");

const ICON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const sayText = w => (w.say || w.vi).replace(/…/g, " ").replace(/[?!]/g, "").trim();
const sayBtn = (t, label, sm) => `<button class="say${sm ? " sm" : ""}" type="button" data-say="${t}" aria-label="${label}" title="${label}">${ICON}</button>`;

const tts = "speechSynthesis" in window ? window.speechSynthesis : null;
let viVoice = null;
const SOUTH = /south|miền nam|mien nam|sài gòn|sai gon|saigon|hcm|hồ chí minh|cần thơ|can tho|cantho/i;
const isSouth = v => SOUTH.test(v.name + " " + v.voiceURI);
function pickVoice(){
  if (!tts) return;
  const vs = tts.getVoices().filter(v => /^vi([-_]|$)/i.test(v.lang));
  const saved = store.get("hv-voice", null);
  viVoice = vs.find(v => v.voiceURI === saved) || vs.find(isSouth) || vs[0] || null;
  const sel = $("voice-sel");
  sel.innerHTML = vs.length
    ? vs.map(v => `<option value="${v.voiceURI}"${v === viVoice ? " selected" : ""}>${v.name}${isSouth(v) ? " (ใต้)" : ""}${v.localService === false ? " · ออนไลน์" : ""}</option>`).join("")
    : `<option>ไม่พบเสียงภาษาเวียดนาม</option>`;
  sel.disabled = vs.length < 2;
  $("voice-info").textContent = vs.length < 2
    ? `เครื่องนี้มีเสียงภาษาเวียดนาม ${vs.length} เสียง · เพิ่มได้ในการตั้งค่าเสียงอ่านของเครื่อง`
    : `พบ ${vs.length} เสียง`;
}
$("voice-test").onclick = () => speak("Xin chào, tôi là người miền Nam", $("voice-test"));
if (!tts) $("voice-row").hidden = true;
$("voice-sel").addEventListener("change", e => { store.set("hv-voice", e.target.value); pickVoice(); speak("Xin chào"); });
if (tts) { pickVoice(); tts.addEventListener?.("voiceschanged", pickVoice); }
function ttsMsg(t){ const m = $("tts-msg"); m.textContent = t || ""; m.hidden = !t; }
function speak(text, btn){
  if (!tts) { ttsMsg("เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง"); return; }
  pickVoice();
  tts.cancel();
  document.querySelectorAll(".say.playing").forEach(b => b.classList.remove("playing"));
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "vi-VN"; u.rate = 0.85;
  if (viVoice) u.voice = viVoice;
  if (btn) { btn.classList.add("playing"); u.onend = u.onerror = () => btn.classList.remove("playing"); }
  ttsMsg(viVoice ? "" : "ไม่พบเสียงภาษาเวียดนามในเครื่องนี้ ถ้าไม่มีเสียงหรือสำเนียงเพี้ยน ให้ติดตั้งเสียงภาษาเวียดนามในการตั้งค่าของเครื่อง");
  tts.speak(u);
}

function render(){
  document.querySelectorAll(".deck").forEach(d => d.setAttribute("aria-selected", d.dataset.deck === deck));
  $("n-han").textContent = WORDS.filter(w => deckOf(w) === "han").length;
  $("n-other").textContent = WORDS.filter(w => deckOf(w) === "other").length;
  $("m-han").hidden = deck !== "han";
  const mode = (curMode === "han" && deck !== "han") ? "vi" : curMode;
  const w = WORDS[order[pos]];
  if (!w) { $("front").innerHTML = `<div class="main"><div class="big-th">ยังไม่มีคำในชุดนี้</div></div>`; $("back").innerHTML = ""; $("count").textContent = "0 / 0"; $("list").innerHTML = ""; return; }
  const big = mode === "vi" ? `<div class="big-vi">${w.vi}</div>`
            : mode === "han" ? `<div class="big-han">${hanOf(w)}</div>`
            : `<div class="big-th">${w.th}</div>`;
  $("front").innerHTML = `<div class="main"><div>${big}</div></div><div class="hint">แตะเพื่อดูความหมายและที่มาของคำ</div>${mode === "th" ? "" : sayBtn(sayText(w), "ฟังเสียงคำนี้")}`;
  $("back").innerHTML = `
    ${w.origin ? `<span class="origin">${w.origin}</span>` : ""}
    <div class="head"><h2>${w.vi}</h2>${sayBtn(sayText(w), "ฟังเสียงคำนี้")}</div>
    <div class="mean">${w.th}</div>
    <div class="parts">${w.parts.map(p => `
      <div class="part">
        <div class="seal${p.han ? "" : " none"}" aria-hidden="true">${p.han || "越"}</div>
        <div class="part-txt">
          <div class="part-vi">${sayBtn(p.vi, "ฟังเสียง " + p.vi, true)} ${p.vi}${p.han ? ` <span style="font-family:var(--f-han)">${p.han}</span><span class="py" title="พินอิน (จีนกลาง)">${p.py}</span>` : ""}</div>
          <div class="part-th">${p.th}</div>
        </div>
      </div>`).join("")}</div>
    ${w.note ? `<p class="note">${w.note}</p>` : ""}
    ${w.src ? `<p class="src">เจอคำนี้จาก: <b>${w.src}</b></p>` : ""}`;
  $("count").textContent = `${pos + 1} / ${order.length}`;
  $("prev").disabled = order.length < 2;
  $("next").disabled = order.length < 2;
  $("known").setAttribute("aria-pressed", known.has(w.vi));
  $("known").textContent = known.has(w.vi) ? "✓ จำได้แล้ว" : "จำได้แล้ว";
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.mode === mode));
  renderList();
}

const fold = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[đĐ]/g, "d").toLowerCase();
const hay = w => [w.vi, w.th, w.say || "", ...w.parts.flatMap(p => [p.vi, p.th, p.han || "", p.py || ""])].join(" | ");
let noteHits = new Set();
function renderList(){
  noteHits = new Set();
  const q = $("q").value.trim();
  const cur = order[pos];
  let items;
  if (q) {
    const exact = fold(q) !== q.toLowerCase();
    const needle = exact ? q.toLowerCase() : fold(q);
    const hit = t => (exact ? t.toLowerCase() : fold(t)).includes(needle);
    const all = WORDS.map((w, i) => i);
    const main = all.filter(i => hit(hay(WORDS[i])));
    const inNote = all.filter(i => !main.includes(i) && hit((WORDS[i].note || "").replace(/<[^>]+>/g, "")));
    noteHits = new Set(inNote);
    items = [...main, ...inNote];
    $("list-title").textContent = `ผลค้นหา "${q}" · ${main.length} คำ` + (inNote.length ? ` + เจอในหมายเหตุ ${inNote.length} ใบ` : "") + " (ทุกชุด)";
  } else {
    items = order;
    $("list-title").textContent = "คำทั้งหมด";
  }
  $("list").innerHTML = items.length ? items.map(i => {
    const x = WORDS[i];
    const badge = q ? `<span class="dk">${noteHits.has(i) ? "ในหมายเหตุ · " : ""}${deckOf(x) === "han" ? "ฮั่นเวียด" : "คำอื่น ๆ"}</span>` : "";
    return `<li><button data-i="${i}" aria-current="${i === cur}">
      <span><span class="lv">${x.vi}</span> · ${x.th}${badge}</span>
      <span>${known.has(x.vi) ? '<span class="tick">✓</span> ' : ""}<span class="lh">${hanOf(x)}</span></span>
    </button></li>`;
  }).join("") : `<li class="empty">ไม่พบคำที่ตรงกับ "${q}"</li>`;
}

function setFlip(on){
  card.classList.toggle("flipped", on);
  $("front").setAttribute("aria-hidden", on);
  $("back").setAttribute("aria-hidden", !on);
}
function show(){
  card.classList.add("instant"); setFlip(false);
  void card.offsetWidth; card.classList.remove("instant");
  render();
}
const flip = () => setFlip(!card.classList.contains("flipped"));
const go = d => { if (!order.length) return; pos = (pos + d + order.length) % order.length; show(); };
card.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b) { e.stopPropagation(); speak(b.dataset.say, b); return; }
  flip();
});
card.addEventListener("keydown", e => {
  if (e.target !== card) { if (e.key === " " || e.key === "Enter") e.stopPropagation(); return; }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); flip(); }
});
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("known").onclick = () => {
  if (!order.length) return;
  const v = WORDS[order[pos]].vi;
  known.has(v) ? known.delete(v) : known.add(v);
  store.set("hv-known", [...known]); render();
};
$("shuffle").onclick = () => {
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0; show();
};
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { curMode = c.dataset.mode; store.set("hv-mode", curMode); render(); });
$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const i = +b.dataset.i;
  if (deckOf(WORDS[i]) !== deck) { deck = deckOf(WORDS[i]); store.set("hv-deck", deck); loadDeck(); }
  pos = Math.max(0, order.indexOf(i));
  show();
  if ($("q").value.trim()) card.scrollIntoView({ behavior: "smooth", block: "center" });
});
$("q").addEventListener("input", renderList);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); flip(); }
});
document.querySelectorAll(".deck").forEach(d => d.onclick = () => { deck = d.dataset.deck; store.set("hv-deck", deck); loadDeck(); show(); });
if (!["han", "other"].includes(deck)) deck = "han";
loadDeck();
render();
</script>
