name: Daily Prediction Markets Report

on:
  schedule:
    # 13:00 UTC every day (~9am ET). Adjust as you like.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours"
        default: "24"
      min_usd:
        description: "Minimum Polymarket trade notional (USD)"
        default: "10000"
      kalshi_min:
        description: "Minimum Kalshi trade notional (USD)"
        default: "5000"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily report
        env:
          # Notifications are optional — set these as repository secrets to
          # enable them. Empty secrets are simply skipped.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          # Use watchlist.json if you've committed one, else fall back to the example.
          WATCHLIST=watchlist.json
          [ -f "$WATCHLIST" ] || WATCHLIST=watchlist.example.json
          python3 -m polytrack \
            --source both \
            --hours "${{ github.event.inputs.hours || '24' }}" \
            --min "${{ github.event.inputs.min_usd || '10000' }}" \
            --kalshi-min "${{ github.event.inputs.kalshi_min || '5000' }}" \
            --watchlist "$WATCHLIST" \
            --notify discord,telegram,email \
            --save

      - name: Upload report to OneDrive (rclone)
        env:
          # Paste the contents of your rclone.conf into this repo secret.
          # See docs/cloud-onedrive.md for the one-time setup.
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          # Optional overrides (defaults shown):
          RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}       # default: onedrive
          ONEDRIVE_DIR: ${{ secrets.ONEDRIVE_DIR }}         # default: Prediction Market update
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "RCLONE_CONF secret not set — skipping OneDrive upload."
            exit 0
          fi
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONF" > "$HOME/.config/rclone/rclone.conf"
          REMOTE="${RCLONE_REMOTE:-onedrive}"
          DIR="${ONEDRIVE_DIR:-Prediction Market update}"
          DAY=$(date -u +%F)
          echo "Uploading reports/${DAY}.md to ${REMOTE}:${DIR}/"
          rclone copy "reports/${DAY}.md" "${REMOTE}:${DIR}/" --no-traverse

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily prediction-market report $(date -u +%Y-%m-%d)"
            git push
          fi
