name: Daily Polymarket Report

on:
  schedule:
    # 13:00 UTC every day (~9am ET). Adjust as you like.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours"
        default: "24"
      min_usd:
        description: "Minimum trade notional (USD)"
        default: "10000"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily report
        run: |
          python3 -m polytrack \
            --hours "${{ github.event.inputs.hours || '24' }}" \
            --min "${{ github.event.inputs.min_usd || '10000' }}" \
            --save

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily Polymarket report $(date -u +%Y-%m-%d)"
            git push
          fi
